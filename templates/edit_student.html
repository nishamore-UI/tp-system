<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="edit-container">

    <div class="edit-card">

        <h2>Edit Student</h2>

        <form method="POST">

            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       name="name"
                       value="{{ student.name }}"
                       required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ student.email }}"
                       required>

            </div>

            <div class="form-group">

                <label>Course</label>

                <input type="text"
                       name="course"
                       value="{{ student.course }}"
                       required>

            </div>

            <div class="form-group">

                <label>Placement Status</label>

                <select name="placement_status">

                    <option value="Placed"
                    {% if student.placement_status == "Placed" %}selected{% endif %}>
                    Placed
                    </option>

                    <option value="Not Placed"
                    {% if student.placement_status == "Not Placed" %}selected{% endif %}>
                    Not Placed
                    </option>

                </select>

            </div>

            <div class="btn-group">

                <button type="submit" class="update-btn">
                    Update Student
                </button>

                <a href="{{ url_for('routes.dashboard') }}"
                   class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
